[package]
name = "asmcode"
version = "0.1.0"
edition = "2024"
description = "ASMCode is a cross-platform, open-source IDE for Intel8080 Assembler built with Rust and Slint."

[dependencies]
slint = "1.19"
rayon = "1.12"
rfd = "0.18.0"
intel-8080-kit = "0.1.1"

[build-dependencies]
slint-build = "1.19"
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
