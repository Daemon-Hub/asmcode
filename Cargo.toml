[package]
name = "asmcode"
version = "1.2.0"
edition = "2024"
description = "ASMCode is a cross-platform, open-source IDE for Intel8080 Assembler built with Rust and Slint."

[dependencies]
slint = { version = "1.19.1", features = ["unstable-winit-030"] }
rayon = "1.12"
rfd = "0.18.0"
intel-8080-kit = "0.1.1"
dirs = "7.0.0"
arboard = "3.7.0"
portable-pty = "0.9.0"
slint-term = "0.1.0-alpha.1"

[build-dependencies]
slint-build = "1.19.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
